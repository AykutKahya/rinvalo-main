# Rinvalo v2 bot: refreshes fixtures, results, predictions and season odds for site/ and
# commits the JSON files. Each commit to main triggers a new Vercel build.
#
# Cost: public repository, so GitHub Actions minutes are free.
name: Rinvalo site bot

on:
  schedule:
    # UTC. Istanbul is UTC+3: 05:23, 11:23 and 18:23. The Monday 05:23 run refetches the whole
    # season; TheSportsDB throttles the free key, so that run takes about half an hour.
    - cron: '23 2 * * 1'
    - cron: '23 2 * * 0,2-6'
    - cron: '23 8,15 * * *'
    # Match days: hourly while games finish (weekends 14:00-23:59, midweek evenings). Scores during a
    # game come from /live.json, so the bot only needs to settle results and refresh predictions.
    # A run commits only when a score, fixture or prediction really changed.
    - cron: '37 14-23 * * 5,6,0,1'
    - cron: '37 19,21,22 * * 2,3,4'
  workflow_dispatch:
    inputs:
      full:
        description: Refetch the whole season
        required: false
        default: false
        type: boolean

concurrency:
  group: rinvalo-site-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine
        run: python -m pip install -r ../engine/requirements.txt

      - name: Test
        run: |
          npm test
          python -m unittest discover -s ../engine

      - name: Update data
        env:
          FULL: ${{ (github.event.schedule == '23 2 * * 1' || inputs.full) && '1' || '0' }}
        run: npm run update

      - name: Match statistics and odds
        continue-on-error: true
        run: npm run stats

      - name: Rinvalo engine predictions
        # If the engine fails, the fallback predictions written by `npm run update` stay in place.
        continue-on-error: true
        run: python ../engine/predict.py

      - name: European cups
        continue-on-error: true
        run: npm run cups

      - name: European cup predictions
        # One Elo scale across the nine leagues and the cups; leaves league predictions untouched.
        continue-on-error: true
        run: python ../engine/cups.py

      - name: Season simulation
        run: npm run simulate

      - name: Commit changed data
        run: |
          git config user.name "rinvalo-bot"
          git config user.email "rinvalo-bot@users.noreply.github.com"
          if ! npx tsx scripts/meaningful.ts; then
            git checkout -- data
            echo "Değişiklik yok."
            exit 0
          fi
          git add data public/crests public/leagues
          git commit -m "Veri güncellemesi $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
